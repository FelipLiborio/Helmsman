[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "helmsman"
version = "0.1.0"
description = "Fuzzy auto-scaler for Docker web services"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
    "scikit-fuzzy>=0.4.2",
    "numpy>=1.24",
    "docker>=7.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.scripts]
helmsman = "helmsman.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["helmsman*"]

[tool.setuptools.package-data]
helmsman = ["frontend_dist/**/*"]
